l_english:

 bm_group_patriam:0 "6355"

 bm_patriam_rise_of_empires:0 "Rise of Empires"
 bm_patriam_rise_of_empires_desc:0 "Southern Kallonia, 6355 after the arrival of the Drunathaen. Fifty realms hold the continent between them, and Thenithria is one of them. Its new ruler is seventeen years old."
 bookmark_patriam_hythaerion:0 "Hythaerion"
 bookmark_patriam_hythaerion_subheading:0 "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_patriam_hythaerion_desc:0 "Hythaerion has held Thenithria for a few days, inherited from his father, and he has already sent for the muster. Before he is done the continent will answer to one throne, Senkaria and Taienmar will fall, and Ketan will pay tribute to a city of white elmin."
