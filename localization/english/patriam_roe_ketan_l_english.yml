l_english:

 # Patriam: Rise of Empires. The Ketanite War, 6355 ADA.
 # All text in Patriamic English. No dash punctuation. British spelling.
 # No contractions in narration.

 patriam_demand_submission_of_ketan:0 "Demand the Submission of Ketan"
 patriam_demand_submission_of_ketan_desc:0 "Ketan sits upon its tiers in the middle sea, harbour below and Imperial Palace above, and every trade route in the world passes through it and pays for the privilege. The House of Milagi has held the city since before Thenithria was anything but rock and wood. No foreign host has ever stood before its walls.\n\nThenithria cannot be the centre of the world while Ketan remains."
 patriam_demand_submission_of_ketan_tooltip:0 "Send emissaries to Ketan demanding that the city acknowledge Thenithria."
 patriam_demand_submission_of_ketan_confirm:0 "Write out the demand"

 patriam_ketan.0001.t:0 "The Emissaries to Ketan"
 patriam_ketan.0001.desc:0 "Southern Kallonia was united. Senkaria had bent, and Taienmar had learned what came of refusing. Only Ketan remained, and Ketan had never in all its history been made to answer to anybody at all.\n\nThe Milagi had never greatly needed walls. They had needed ledgers, and they had kept them well, and sixteen centuries of every caravan and every keel in the world passing beneath their harbour chain had made them the richest family ever to hold a city.\n\n[ROOT.Char.GetFirstName] wrote out the demand in his own hand and gave it to the emissaries. Thenithria was to be the centre of the world. Ketan was to acknowledge it."
 patriam_ketan.0001.a:0 "Honourable terms. Ketan keeps its tiers and its trade, and pays for the keeping."
 patriam_ketan.0001.b:0 "Name the tribute in the letter. Let them read the figure before they read the threat."
 patriam_ketan.0001.c:0 "Remind them what Taienmar answered, and where Taienmar is now."

 patriam_ketan.0002.t:0 "The Answer of the Milagi"
 patriam_ketan.0002.desc.honourable:0 "The emissaries came home in good health and in excellent spirits, which was itself the answer. Ikon Milagi had received them in the Imperial Palace, had fed them for eleven days on food they could not name, and had sent them back with gifts and with a letter of two lines.\n\nThe letter observed that Ketan had traded with Thenithria since before Thenithria had a king, and would gladly trade with it long after, and that the House of Milagi did not recall having asked for a master.\n\n[ROOT.Char.GetFirstName] read it twice. Then he sent for every shipwright in Southern Kallonia."
 patriam_ketan.0002.desc.tribute:0 "The emissaries came home with the demand returned to them, and the figure had been corrected in the margin in a neat merchant hand.\n\nIkon Milagi had written beneath it that the sum was arithmetically sound but commercially absurd, that Ketan would be happy to quote a price for its own submission should Thenithria ever be in a position to pay it, and that the House of Milagi did not recall having asked for a master.\n\n[ROOT.Char.GetFirstName] read the correction twice. Then he sent for every shipwright in Southern Kallonia."
 patriam_ketan.0002.desc.threat:0 "The emissaries came home pale, and not on account of anything done to them. Ikon Milagi had heard the mention of Taienmar out in full, without once interrupting, and had then walked them to the parapet of the Imperial Palace and invited them to count the keels in the harbour below.\n\nThey had stopped counting somewhere past three hundred. The letter they carried back said only that Ketan had noted the comparison and found it flattering to Taienmar.\n\n[ROOT.Char.GetFirstName] read it twice. Then he sent for every shipwright in Southern Kallonia."
 patriam_ketan.0002.a:0 "Then Ketan will be the first war they have ever had to fight."

 patriam_ketan.0003.t:0 "The Sinking of the Ketanite Navy"
 patriam_ketan.0003.desc:0 "The Ketanite Navy came out into open water to meet the fleet, and it came out confident, for it had spent an age escorting grain and putting down pirates and had never once been asked to fight for the city that built it.\n\nThey were the finest merchantmen ever launched, and on that morning they were merchantmen still. The Thenithrian line came on in wedges, took the weather side, and did not trouble itself with boarding.\n\nBy the middle of the afternoon the sea between the fleet and the harbour chain was a field of spars, and the wealth of an age was going down in it, and from the upper tiers of Ketan the whole of it could be watched in comfort."
 patriam_ketan.0003.a:0 "I will take the van myself. Let them see which keel comes first."
 patriam_ketan.0003.b:0 "I will hold the centre. The wings will do the work, and do it properly."

 patriam_ketan.0004.t:0 "The Arithmetic of Merchants"
 patriam_ketan.0004.desc:0 "So began the only siege ever laid against Ketan by a foreigner.\n\nThe city could have held for thirty years and both sides knew it. The granaries went down four levels into the rock, the cisterns were fed from the mountain, and no army in the world could starve a place that had been provisioning the world since before there were armies.\n\nWhat Ketan could not do was hold out and remain Ketan. A besieged city is a city nobody can trade with, and the caravan masters had already begun to enquire, politely and in writing, whether the northern road might not serve just as well. Thirty years of siege would leave the Milagi holding the wealthiest ruin in Patriam.\n\nIkon Milagi understood that arithmetic considerably before his council did. A boat came out from the harbour under a merchant flag rather than a war flag, which was a distinction [ROOT.Char.GetFirstName] was careful to notice."
 patriam_ketan.0004.a:0 "Receive them. A city that offers terms in the first season is worth more whole."
 patriam_ketan.0004.b:0 "Let them sit one more season. The price of the second offer is always better."

 patriam_ketan.0005.t:0 "The Parade to the Imperial Palace"
 patriam_ketan.0005.desc.prompt:0 "The harbour chain came down and the gates were opened, and [ROOT.Char.GetFirstName] was invited into Ketan, which no foreign ruler had ever been.\n\nThe parade went up through every tier from the harbour to the summit and it took the better part of a day. The tiers were lined the whole way, not in mourning and not in welcome, but in plain astonishment at the sight of the only man who had ever brought their city to terms.\n\nAt the top, upon the steps of the Imperial Palace, Ikon Milagi knelt upon the stone and thanked Hythaerion for his mercy in sparing Ketan. He did it in a clear voice and in front of everybody, and he meant the thanks exactly as much as he meant the kneeling, which the two of them understood perfectly well between them.\n\nKetan would pay tribute and trading fees to Thenithria. The last of the white elmin would go up on the coin of the city it had been built to rival, and Thenithria would become what Ketan had been."
 patriam_ketan.0005.desc.late:0 "The second offer, when it came, was a good deal better than the first, and a good deal was owed for the difference.\n\nThe harbour chain came down and the gates were opened, and [ROOT.Char.GetFirstName] was invited into Ketan, which no foreign ruler had ever been. The parade went up through every tier from the harbour to the summit and it took the better part of a day. The tiers were lined the whole way in a silence that had rather more in it than astonishment.\n\nAt the top, upon the steps of the Imperial Palace, Ikon Milagi knelt upon the stone and thanked Hythaerion for his mercy in sparing Ketan. The words were the correct ones and the voice was steady, and every soul upon those steps knew what a winter of empty wharves had cost to produce them.\n\nKetan would pay tribute and trading fees to Thenithria, and would pay rather more of both than it had first proposed. The last of the white elmin would go up on the coin of the city it had been built to rival, and Thenithria would become what Ketan had been."
 patriam_ketan.0005.a:0 "Rise, Ikon Milagi. The world has a new centre, and you shall trade with it."
